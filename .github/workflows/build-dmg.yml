name: Build desktop packages
on:
  push:
    branches: [master, 'consolidated-*']
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: zuckermixer-build-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test-suite:
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements_app.txt -r requirements_whisper.txt pytest
      - run: python -m pytest -q
      - run: node test_state_loading.js && node test_render_messages.js && node test_split_time.js
  build-dmg:
    needs: test-suite
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build and verify macOS
        env:
          ZUCKER_SOURCE_REVISION_OVERRIDE: ${{ github.sha }}
        run: |
          ./build_app.sh
          dist/ZuckerMixer.app/Contents/MacOS/ZuckerMixer --self-check
          codesign --verify --deep --strict dist/ZuckerMixer.app
      - uses: actions/upload-artifact@v4
        with:
          name: ZuckerMixer-macOS
          path: dist/ZuckerMixer-*.dmg
          if-no-files-found: error
  build-windows:
    needs: test-suite
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build and verify Windows
        shell: pwsh
        env:
          ZUCKER_SOURCE_REVISION_OVERRIDE: ${{ github.sha }}
        run: ./build_windows.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: ZuckerMixer-Windows
          path: dist/ZuckerMixer-*-Windows.zip
          if-no-files-found: error
  draft-release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-dmg, build-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true
      - name: Prepare draft with packages and source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git archive --format=zip --prefix=ZuckerMixer/ -o release/ZuckerMixer-${GITHUB_REF_NAME}-source.zip HEAD
          cd release
          sha256sum *.dmg *.zip > SHA256SUMS.txt
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft --title "ZuckerMixer $GITHUB_REF_NAME" --notes-file ../CHANGELOG.md ./*
