name: Build desktop packages
on:
  push:
    branches: [master, 'consolidated-*']
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      artifact_run:
        description: Existing successful build run to attach to the draft release
        required: false
        type: string
permissions:
  contents: read
concurrency:
  group: zuckermixer-build-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test-suite:
    if: inputs.artifact_run == ''
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements_app.txt -r requirements_whisper.txt pytest
      - run: python -m pytest -q
      - run: node test_state_loading.js && node test_render_messages.js && node test_split_time.js && node test_preview_source_gain.js && node test_vocal_expander.js && node test_preview_normalization.js && node test_preview_gate.js && node test_updater.js && node test_render_listening.js && node test_loading_overlay_dismiss.js && node test_cancel_ui.js
  build-dmg:
    needs: test-suite
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build and verify macOS
        env:
          ZUCKER_SOURCE_REVISION_OVERRIDE: ${{ github.sha }}
        run: |
          ./build_app.sh
          dist/ZuckerMixer.app/Contents/MacOS/ZuckerMixer --update-helper --self-check
          dist/ZuckerMixer.app/Contents/MacOS/ZuckerMixer --self-check
          codesign --verify --deep --strict dist/ZuckerMixer.app
      - uses: actions/upload-artifact@v4
        with:
          name: ZuckerMixer-macOS
          path: dist/ZuckerMixer-*.dmg
          if-no-files-found: error
  build-windows:
    needs: test-suite
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build and verify Windows
        shell: pwsh
        env:
          ZUCKER_SOURCE_REVISION_OVERRIDE: ${{ github.sha }}
        run: ./build_windows.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: ZuckerMixer-Windows
          path: dist/ZuckerMixer-*-Windows.zip
          if-no-files-found: error
  draft-release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-dmg, build-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true
      - name: Prepare draft with packages and source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git archive --format=zip --prefix=ZuckerMixer/ -o release/ZuckerMixer-${GITHUB_REF_NAME}-source.zip HEAD
          cd release
          sha256sum *.dmg *.zip > SHA256SUMS.txt
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft --title "ZuckerMixer $GITHUB_REF_NAME" --notes-file ../CHANGELOG.md ./*

  attach-draft:
    if: github.event_name == 'workflow_dispatch' && inputs.artifact_run != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          run-id: ${{ inputs.artifact_run }}
          github-token: ${{ github.token }}
          path: release
          merge-multiple: true
      - name: Attach verified packages, source and checksums to existing draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="$(cat VERSION | tr -d '[:space:]')"
          git archive --format=zip --prefix=ZuckerMixer/ -o "release/ZuckerMixer-$VERSION-source.zip" HEAD
          cd release
          sha256sum *.dmg *.zip > SHA256SUMS.txt
          gh release upload "v$VERSION" --repo "$GITHUB_REPOSITORY" --clobber ./*
