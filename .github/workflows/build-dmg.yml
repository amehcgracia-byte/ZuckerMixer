name: Build macOS DMG

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-dmg:
    name: Build ZuckerMixer DMG
    runs-on: macos-13

    steps:
      - name: Checkout exact source
        uses: actions/checkout@v4

      - name: Read application version
        id: version
        shell: bash
        run: |
          version="$(tr -d '[:space:]' < VERSION)"
          test -n "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Building ZuckerMixer $version from $GITHUB_SHA"

      - name: Build application and versioned DMG
        shell: bash
        env:
          ZUCKER_SOURCE_REVISION_OVERRIDE: ${{ github.sha }}
        run: |
          chmod +x build_app.sh
          ./build_app.sh
          test -f "dist/ZuckerMixer-${{ steps.version.outputs.version }}.dmg"
          hdiutil imageinfo "dist/ZuckerMixer-${{ steps.version.outputs.version }}.dmg" | grep -E 'image-variant|partition-partition' || true

      - name: Upload versioned DMG
        uses: actions/upload-artifact@v4
        with:
          name: ZuckerMixer-${{ steps.version.outputs.version }}
          path: dist/ZuckerMixer-${{ steps.version.outputs.version }}.dmg
          if-no-files-found: error
          retention-days: 30
